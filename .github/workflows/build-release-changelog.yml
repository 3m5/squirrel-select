name: Release

permissions: {}

on:
  push:
    tags:
      - 'v*'

jobs:

  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies and build 🔧
        run: npm ci --ignore-scripts && npm run build
      # Node 24 already ships npm 11.9, but trusted publishing needs >= 11.5.1
      # and we do not want a release to depend on what the runner happens to ship.
      - name: Update npm
        run: npm install -g npm@^11.5
      - name: Publish package on NPM 📦
        run: npm publish

  github-release:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@cb021f9b36a51a7c6f18e4679b6fa2cb77a1260c # v6.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commitMode: true
          failOnError: true
          configurationJson: |
            {
              "template": "<h2>What's Changed</h2>#{{UNCATEGORIZED}}",
              "pr_template": "● #{{TITLE}} by @#{{AUTHOR}}\n"
            }
      - name: Create Github release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifactErrorsFailBuild: true
          # a release created by hand for the tag must not fail the job
          allowUpdates: true
          # ToDo remove with v1.0.0
          prerelease: true
          body: ${{steps.build_changelog.outputs.changelog}}
