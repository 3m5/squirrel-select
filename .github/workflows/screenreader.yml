name: Screen reader

# NVDA with Chromium on Windows and VoiceOver with WebKit on macOS, ten repetitions without retries

permissions: {}

on:
  push:
    branches:
      - spike/screenreader
  workflow_dispatch:

concurrency:
  group: screenreader-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:

  site:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build library and site
        run: npm run site
      - name: Upload site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: _site/
          if-no-files-found: error
          retention-days: 1

  screenreader:
    name: ${{ matrix.project }}
    needs: site
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: nvda-chromium
            os: windows-2025
            browser: chromium
          - project: voiceover-webkit
            os: macos-26
            browser: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read # checkout only
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Download site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site
      - name: Prepare the system for screen reader automation
        run: npx guidepup setup --ci
      # the assets are checked against the SHA-256 sums in @guidepup/guidepup, which the lockfile pins
      - name: Install screen reader assets
        run: npx guidepup install
      - name: Install browser
        env:
          BROWSER: ${{ matrix.browser }}
        run: npx playwright install "$BROWSER"
      - name: Screen reader tests, ten times each
        env:
          PROJECT: ${{ matrix.project }}
        run: npx playwright test -c tests/screenreader --project="$PROJECT" --repeat-each=10
      - name: Upload report and transcripts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenreader-${{ matrix.project }}
          path: |
            screenreader-report/
            test-results/screenreader/
          retention-days: 14
