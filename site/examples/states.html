<style>
  @font-face {
    font-family: "Atkinson Hyperlegible Next";
    src: url("../assets/fonts/atkinson-hyperlegible-next-latin-wght.woff2") format("woff2");
    font-weight: 200 800;
    font-display: block;
  }
  :root {
    color-scheme: light dark;
    --page-bg: light-dark(#f4f5f7, #121418);
    --page-card: light-dark(#fff, #1b1f24);
    --page-text: light-dark(#1c2024, #e4e7eb);
    --page-muted: light-dark(#596370, #a3adb8);
    --page-line: light-dark(#dde1e6, #2e353d);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 1.5rem 1rem 4rem;
    font: 16px/1.5 "Atkinson Hyperlegible Next", sans-serif;
    color: var(--page-text);
    background: var(--page-bg);
  }
  main { max-inline-size: 64rem; margin-inline: auto; }
  h1 { margin: 0; font-size: 1.5rem; }
  h1 + p { margin: 0 0 1.5rem; }
  a { color: inherit; }
  .cases { display: grid; gap: 1rem; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-block-end: 1rem; }
  @media (width < 48rem) { .cases { grid-template-columns: minmax(0, 1fr); } }
  .fall { margin: 0; padding: 1rem; background: var(--page-card); border: 1px solid var(--page-line); border-radius: .5rem; }
  .fall.wide { grid-column: 1 / -1; }
  .fall figcaption { margin-block-end: .375rem; font-size: .875rem; font-weight: 700; }
  .fall .sqs { inline-size: 100%; }
  .fall form, .fall fieldset { margin: 0; padding: 0; border: 0; }
  .fall details { margin-block-start: .5rem; font-size: .8125rem; color: var(--page-muted); }
  .fall pre { overflow: auto; white-space: pre-wrap; }
  .error { margin: .375rem 0 0; font-size: .8125rem; color: light-dark(#b3261e, #ff9b91); }
  .narrow { inline-size: 7rem; }
  .filterbar { --sqs-bg: light-dark(#eef0f3, #262b32); --sqs-border: light-dark(#4d5965, #a5b1bc); }
  .look-moss {
    --sqs-text: light-dark(#18241c, #e2ece4); --sqs-muted: light-dark(#4f6054, #a9baad);
    --sqs-bg: light-dark(#fbfdfb, #151d18); --sqs-surface: light-dark(#fff, #1d2820);
    --sqs-border: light-dark(#6d7e72, #7a8a7e); --sqs-accent: light-dark(#2e6a3b, #8fd19e);
    --sqs-radius: .75rem; --sqs-padding-inline: 1em;
  }
  .look-steel {
    --sqs-text: light-dark(#111820, #e6ebf0); --sqs-muted: light-dark(#4d5965, #a5b1bc);
    --sqs-bg: light-dark(#fff, #12171c); --sqs-surface: light-dark(#fff, #1a2127);
    --sqs-border: light-dark(#5f6b76, #808b95); --sqs-accent: light-dark(#0b5b78, #7cc7e8);
    --sqs-radius: 2px; --sqs-font-size: .875rem; --sqs-padding-block: .375em;
    --sqs-shadow: 0 2px 6px light-dark(rgb(0 0 0 / 16%), rgb(0 0 0 / 60%));
  }
  .look-coral {
    --sqs-text: light-dark(#2a1a16, #f3e6e2); --sqs-muted: light-dark(#6b524c, #c4aca5);
    --sqs-bg: light-dark(#fff8f5, #221917); --sqs-surface: light-dark(#fff, #2c211e);
    --sqs-border: light-dark(#9b766d, #94776f); --sqs-accent: light-dark(#ad3624, #ff9e8a);
    --sqs-invalid: light-dark(#8f1d5c, #ff8fc8);
    --sqs-radius: 999px; --sqs-border-width: 2px; --sqs-font-size: 1.0625rem;
  }
</style>
</head>
